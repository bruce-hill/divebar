[package]
name = "divebar"
version = "0.1.0"
description = "A statusbar for Linux with HTML/CSS styling"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "x11", "dbus", "dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = "0.13"
png = "0.17"
base64 = "0.22"
system-tray = "0.8"
tokio = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
gdkx11 = "0.18"
webkit2gtk = "2.0"

[profile.release]
strip = true
lto = false
incremental = true
# Abort on panic: drops the unwinding machinery from the binary. Note a
# panic on any thread now exits the whole bar instead of killing just
# that thread.
panic = "abort"
