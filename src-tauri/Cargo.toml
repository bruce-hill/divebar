[package]
name = "divebar"
version = "0.1.0"
description = "A statusbar for Linux with HTML/CSS styling"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
x11rb = "0.13"
png = "0.17"
base64 = "0.22"
system-tray = "0.8"
freedesktop-icons = "0.4"
tokio = "1"
zbus = "5"
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"

[profile.release]
strip = true
lto = true
